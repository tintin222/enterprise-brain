id: procurement.supplier-onboarding
department: procurement
name: Supplier Onboarding
summary: >-
  New suppliers' documents (tax certificate, trade registry gazette, signature circular, bank letter,
  certificates) are read, checked for completeness, validity and consistency, screened for duplicates
  and, after approval, the supplier is created in the ERP.
description: >-
  Onboarding a supplier requires a stack of documents and careful checks: correct tax number, valid
  IBAN in the supplier's name, authorised signatories, current certificates, no duplicate in the
  master. The Supplier Onboarding Agent reads the documents, extracts the master data, checks
  completeness and consistency, and prepares the approval; vendor master data verifies the bank
  details by call-back before the first payment.
trigger:
  type: mail
  description: A new supplier sends the onboarding documents (supplier onboarding mailbox or portal upload).
frequency: Continuous; 10-50 new suppliers per month
steps:
  - id: receive
    name: Receive supplier documents
    actor: system:mail
  - id: check
    name: Check documents and data
    actor: agent:procurement.supplier-onboarding-agent
    description: Document completeness and validity, tax ID and IBAN checks, signatories, duplicate check.
  - id: compliance
    name: Compliance screening for high-risk suppliers
    actor: human:compliance-officer
    approval: true
    description: Sanctions and anti-bribery screening for foreign or high-risk suppliers.
  - id: approve
    name: Approve the new supplier
    actor: human:procurement-manager
    approval: true
    sla: 2 business days
  - id: create
    name: Create the supplier master
    actor: system:erp
  - id: verify-bank
    name: Verify bank details by call-back
    actor: human:vendor-master-data-specialist
    description: Bank details are confirmed by phone with a known contact before the first payment.
agents:
  - procurement.supplier-onboarding-agent
kpis:
  - id: onboarding-time
    name: Documents-to-active supplier
    unit: days
    target: "< 5"
  - id: first-time-right
    name: Supplier master records without later corrections
    unit: "%"
    target: "> 98"
  - id: incomplete-submissions
    name: Submissions with missing documents
    unit: "%"
integrations:
  - category: mail
    purpose: Receive supplier documents.
    required: true
  - category: erp
    purpose: Duplicate check and supplier creation.
    required: true
  - category: other
    purpose: Sanctions and credit screening services.
    required: false
useCases: [document-processing]
value:
  hoursSavedPerMonth: 25
  description: 30 suppliers a month with about 50 minutes of document checking and data entry saved each; fewer payment frauds through consistent bank checks.
maturity: ready
