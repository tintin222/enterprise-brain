# Enterprise Brain, one app and its database:
#
#   docker compose up -d
#
#   Open http://localhost:3200
#
# The first start builds the app (a few minutes) and sets up the demo company, Acme, with its departments,
# AI employees and demo people you can sign in as with one click. For your own company, set
# EB_SEED_DEMO=false and EB_COMPANY_NAME before the first start: the first person to open the app then
# becomes its admin and sets up sign-in (Microsoft 365 or Google), connections and people in Settings.
#
# Optional settings (ANTHROPIC_API_KEY for Claude, the company, sign-in, another port…) go in a .env file
# next to this one; see .env.example. The app is published on this computer only (127.0.0.1). To let
# colleagues reach it, set EB_BIND=0.0.0.0 and EB_PUBLIC_URL to the address they use, after you have
# created the admin account (or put it behind your reverse proxy with HTTPS).
#
# Want Paperclip too? docker compose -f docker-compose.paperclip.yml up -d (see docs/PAPERCLIP.md).
name: enterprise-brain

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brain}
      POSTGRES_DB: enterprise_brain
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d enterprise_brain"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  brain:
    build: .
    image: enterprise-brain:local
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${EB_BIND:-127.0.0.1}:${EB_PORT:-3200}:3200"
    environment:
      PORT: 3200
      DATABASE_URL: postgres://brain:${POSTGRES_PASSWORD:-brain}@db:5432/enterprise_brain
      EB_PUBLIC_URL: ${EB_PUBLIC_URL:-http://localhost:${EB_PORT:-3200}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      # The company this installation is for, and whether to fill it with demo data on first start.
      EB_COMPANY_SLUG: ${EB_COMPANY_SLUG:-acme}
      EB_COMPANY_NAME: ${EB_COMPANY_NAME:-Acme Endüstri A.Ş.}
      EB_MAIL_DOMAIN: ${EB_MAIL_DOMAIN:-acme.com.tr}
      EB_SEED_DEMO: ${EB_SEED_DEMO:-true}
      # People sign in. Microsoft 365 and Google can also be set up in the app (Settings → People and roles).
      EB_AUTH: ${EB_AUTH:-accounts}
      EB_AUTH_MICROSOFT_CLIENT_ID: ${EB_AUTH_MICROSOFT_CLIENT_ID:-}
      EB_AUTH_MICROSOFT_CLIENT_SECRET: ${EB_AUTH_MICROSOFT_CLIENT_SECRET:-}
      EB_AUTH_MICROSOFT_TENANT: ${EB_AUTH_MICROSOFT_TENANT:-}
      EB_AUTH_GOOGLE_CLIENT_ID: ${EB_AUTH_GOOGLE_CLIENT_ID:-}
      EB_AUTH_GOOGLE_CLIENT_SECRET: ${EB_AUTH_GOOGLE_CLIENT_SECRET:-}
      EB_AUTH_GOOGLE_HOSTED_DOMAIN: ${EB_AUTH_GOOGLE_HOSTED_DOMAIN:-}
      # Machines (the MCP endpoint, scripts) send it as a Bearer token.
      EB_API_KEY: ${EB_API_KEY:-}
      # Encrypts connection secrets. Unset: a random key is generated once in the data volume (/data).
      EB_MASTER_KEY: ${EB_MASTER_KEY:-}
    volumes:
      - braindata:/data
    restart: unless-stopped

volumes:
  pgdata:
  braindata:
